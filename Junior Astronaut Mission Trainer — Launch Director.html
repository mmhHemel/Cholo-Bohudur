<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Junior Astronaut Mission Trainer — Launch Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#EDEFF3; --panel:#FFFFFF; --panel2:#F1F3F8; --border:#C7CDD9; --text:#131A29; --dim:#4B5468;
    --gold:#B9761F; --teal:#0E8C82; --danger:#C23B52; --ok:#1E9E5A; --warn:#C98A12;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0D1321; --panel:#141B2E; --panel2:#1B2440; --border:#2A3550; --text:#E7ECF5; --dim:#9AA5BD;
      --gold:#F2A93B; --teal:#35D0BA; --danger:#F0637A; --ok:#4ADE80; --warn:#FBBF24;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0D1321; --panel:#141B2E; --panel2:#1B2440; --border:#2A3550; --text:#E7ECF5; --dim:#9AA5BD;
    --gold:#F2A93B; --teal:#35D0BA; --danger:#F0637A; --ok:#4ADE80; --warn:#FBBF24;
  }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  html, body { height:100%; margin:0; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',system-ui,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }
  #app { height:100%; max-width:1100px; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); }

  header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .brand .logo { font-size:22px; }
  .brand b { font-family:'Space Grotesk',sans-serif; font-size:15px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .brand small { color:var(--dim); font-size:11.5px; font-family:'IBM Plex Mono',monospace; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .iconbtn { background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; width:38px; height:38px; font-size:16px; cursor:pointer; flex:none; }

  #board { display:flex; align-items:center; gap:6px; padding:7px 12px; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; }
  .lamp { display:flex; align-items:center; gap:6px; padding:3px 9px; border:1px solid var(--border); border-radius:99px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); white-space:nowrap; flex:none; }
  .lamp i { width:10px; height:10px; border-radius:50%; background:var(--border); display:block; }
  .lamp.active { border-color:var(--gold); color:var(--text); }
  .lamp.active i { background:var(--gold); animation:pulse 1.1s infinite; }
  .lamp.go { border-color:var(--ok); color:var(--ok); }
  .lamp.go i { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .lamp.nogo { border-color:var(--danger); color:var(--danger); }
  .lamp.nogo i { background:var(--danger); animation:pulse .5s infinite; }
  #holds { margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); white-space:nowrap; flex:none; padding-left:8px; }
  @keyframes pulse { 50% { opacity:.35; } }

  #stage { position:relative; flex:1; min-height:200px; background:#05070f; overflow:hidden; }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud { position:absolute; inset:0; pointer-events:none; display:none; color:#fff; font-family:'IBM Plex Mono',monospace; }
  #hud .clock { position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:clamp(22px,5vw,34px); font-weight:500; letter-spacing:.04em; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  #hud .tele { position:absolute; top:12px; left:12px; font-size:12px; line-height:1.6; background:rgba(5,8,18,.55); padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.15); }
  #hud .tele b { color:#F2A93B; font-weight:500; }
  #cap { position:absolute; left:0; right:0; bottom:0; padding:30px 16px 14px; background:linear-gradient(transparent, rgba(0,0,0,.8)); color:#fff; display:none; }
  #cap h3 { font-family:'Space Grotesk',sans-serif; font-size:clamp(17px,3.6vw,22px); margin:0 0 3px; }
  #cap p { margin:0; font-size:clamp(12.5px,2.6vw,14.5px); color:#d6deee; max-width:62ch; }
  #skip { position:absolute; right:10px; bottom:10px; pointer-events:auto; display:none; background:rgba(5,8,18,.6); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit; }

  #zone { background:var(--panel); border-top:1px solid var(--border); padding:14px; max-height:56vh; overflow:auto; }
  #zone:empty { display:none; }
  .station { font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--teal); margin-bottom:4px; }
  #zone h2 { font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 4px; }
  #zone p.txt { margin:0 0 12px; color:var(--dim); font-size:14.5px; line-height:1.5; max-width:72ch; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .opt { text-align:left; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:11px 12px; cursor:pointer; color:var(--text); font-family:inherit; display:flex; flex-direction:column; gap:5px; transition:transform .12s, border-color .12s; }
  .opt:hover { transform:translateY(-2px); border-color:var(--gold); }
  .opt .oi { font-size:24px; line-height:1; }
  .opt .ol { font-weight:600; font-size:14.5px; }
  .tag { font-size:12px; display:block; }
  .tag.pro { color:var(--ok); }
  .tag.con { color:var(--danger); }
  .btn { background:var(--gold); color:#1a1205; border:0; border-radius:8px; padding:11px 22px; font-weight:600; font-size:15px; font-family:inherit; cursor:pointer; margin-top:12px; }
  .btn.ghost { background:transparent; color:var(--text); border:1px solid var(--border); margin-left:8px; }
  .verdict { display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:6px; }
  .verdict.go { color:var(--ok); } .verdict.nogo { color:var(--danger); }
  .why { margin:0 0 8px; font-size:14.5px; line-height:1.5; }
  .fact { margin:0; font-size:13.5px; color:var(--dim); line-height:1.5; border-left:3px solid var(--teal); padding-left:10px; }
  .advisor { display:flex; gap:12px; padding:12px; border:1px solid var(--warn); border-radius:10px; background:var(--panel2); margin:6px 0 8px; }
  .advisor svg { flex:none; }
  .advisor p { margin:2px 0; font-size:14px; line-height:1.45; }
  .stars { font-size:32px; letter-spacing:6px; margin:2px 0 6px; }
  .debrief { list-style:none; padding:0; margin:10px 0 0; }
  .debrief li { padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; line-height:1.45; }
  .debrief li b { font-family:'Space Grotesk',sans-serif; }
  .note { font-size:12px; color:var(--dim); margin-top:10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo">🚀</span><div><b>Junior Astronaut Mission Trainer</b><small>LAUNCH DIRECTOR · KENNEDY SPACE CENTER · PAD 39A</small></div></div>
    <button class="iconbtn" id="sound" aria-label="Toggle sound" title="Sound">🔊</button>
  </header>
  <div id="board" aria-label="Go / No-Go poll status"></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><div class="clock" id="clock"></div><div class="tele" id="tele"></div></div>
    <div id="cap"><h3 id="capT"></h3><p id="capP"></p></div>
    <button id="skip">Skip to orbit ⏭</button>
  </div>
  <div id="zone" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const rand = (a,b) => a + Math.random()*(b-a);
const TS = Math.max(0.1, parseFloat(new URLSearchParams(location.search).get('speed')) || 1);
const now = () => performance.now()/1000*TS;
const hex = c => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
const mixc = (a,b,t) => { const A=hex(a), B=hex(b); return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`; };
function interp(keys, x){ for (let i=1;i<keys.length;i++){ if (x <= keys[i][0]){ const [x0,y0]=keys[i-1], [x1,y1]=keys[i]; return lerp(y0,y1,(x-x0)/(x1-x0)); } } return keys[keys.length-1][1]; }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============ GAME DATA: five real launch trade-offs ============ */
const STATIONS = [
 { id:'seals', lamp:'SEALS', icon:'🧊', role:'Booster Engineer', title:'Cold morning at the pad',
   text:'It is only 2 °C (36 °F). The rubber seals in the rocket boosters get stiff when it is cold, and stiff seals can leak hot gas. The schedule says: launch today.',
   options:[
    { icon:'🚀', label:'Launch on schedule', pro:'Keeps the schedule', con:'Seals may be too stiff', ok:false,
      why:'Schedule pressure is not a safety reason. Stiff seals could leak hot gas the moment the boosters light.' },
    { icon:'⏳', label:'Wait for a warmer day', pro:'Seals stay flexible', con:'Costs a day and money', ok:true,
      why:'Delaying is the professional call. A day of delay is cheap compared with the risk to the crew.' },
    { icon:'🎛️', label:'Launch, but fly a gentler path', pro:'Less strain in flight', con:'Seals must work at ignition', ok:false,
      why:'The seals have to hold at ignition, long before the flight path matters.' } ],
   fact:'In January 1986, Space Shuttle Challenger launched on a morning near freezing. The coldest earlier launch had been about 12 °C. Investigators traced the accident to a cold-stiffened rubber seal in a booster joint, and engineers had warned about the cold. Launch teams now learn to trust data over the schedule.' },

 { id:'payload', lamp:'PAYLOAD', icon:'📦', role:'Payload Manager', title:'Extra cargo request',
   text:'Scientists want to add 5 extra tonnes of experiments. The shuttle can carry about 25 tonnes to orbit, and the planned cargo already fills most of that. Every extra kilogram needs extra fuel to lift.',
   options:[
    { icon:'➕', label:'Add the extra 5 tonnes', pro:'More science', con:'Less fuel margin', ok:false,
      why:'A rocket must lift its own fuel too, so each extra kilogram needs even more fuel. Past the tested limit it cannot reach orbit safely.' },
    { icon:'✅', label:'Keep the planned cargo', pro:'Inside the tested limit', con:'Less science this flight', ok:true,
      why:'The planned cargo was calculated with a safety margin. Engineers balance science against fuel.' },
    { icon:'🈳', label:'Fly with an empty cargo bay', pro:'Maximum fuel margin', con:'No mission goal', ok:false,
      why:'Safe, but pointless. A rocket exists to deliver something, so the aim is the best balance, not zero cargo.' } ],
   fact:'Rocket engineers call this the tyranny of the rocket equation: to carry more, you need more fuel, and that fuel has to be lifted too.' },

 { id:'direction', lamp:'TRAJECTORY', icon:'🧭', role:'Flight Dynamics', title:'Which way do we fly?',
   text:'After liftoff the shuttle must curve toward its orbit. The Earth spins toward the east, and Florida has the Atlantic Ocean on that side.',
   options:[
    { icon:'➡️', label:'East, over the ocean', pro:'Free speed from Earth\'s spin', con:'Needs a precise launch time', ok:true,
      why:'Launching east borrows the ground\'s own motion, and a failed rocket falls into the sea, not onto towns.' },
    { icon:'⬅️', label:'West, over Florida', pro:'Different view of Earth', con:'Fights the spin, crosses land', ok:false,
      why:'Going west works against the Earth\'s spin, so it needs far more fuel, and it flies over people.' },
    { icon:'⬆️', label:'North, along the coast', pro:'Reaches a high-latitude orbit', con:'Crosses populated land', ok:false,
      why:'A northern path passes over towns and cities, which is a safety problem for a launch from Florida.' } ],
   fact:'At Florida, the ground already moves east at about 1,470 km/h because the Earth spins. Launching east borrows that speed for free.' },

 { id:'abort', lamp:'ABORT', icon:'🛟', role:'Flight Director', title:'What if something goes wrong?',
   text:'During the first 8 minutes, a failure could force the crew to abort. The team has to decide how prepared to be.',
   options:[
    { icon:'⏩', label:'Skip the abort briefing', pro:'Saves 30 minutes', con:'Crew is unprepared', ok:false,
      why:'A saved half hour is not worth it. Crews must know every abort option before they climb aboard.' },
    { icon:'🛬', label:'Brief abort modes and pick backup runways across the Atlantic', pro:'Crew ready for any failure', con:'Takes extra planning time', ok:true,
      why:'Having a rehearsed fallback for every stage of ascent is what lets a team launch with confidence.' },
    { icon:'🔧', label:'Plan to fix problems in flight', pro:'No extra planning', con:'No safe fallback', ok:false,
      why:'Some failures happen in seconds. Hoping to fix them in flight is not a plan.' } ],
   fact:'Shuttle crews trained for abort modes: return to the launch site, or land on emergency runways in Spain, France and Morocco. Teams checked the weather at those runways before every launch.' },

 { id:'fuel', lamp:'FUEL', icon:'⛽', role:'Propulsion Engineer', title:'Leak alarm during fueling',
   text:'While the tank is being filled, a sensor shows a small leak of liquid hydrogen at a connection. Hydrogen is colder than -250 °C and burns very easily.',
   options:[
    { icon:'🙈', label:'Ignore it, small leaks are normal', pro:'Keeps the countdown', con:'Fire and explosion risk', ok:false,
      why:'Hydrogen leaks can ignite. A leak is never something to ignore near a fully fueled rocket.' },
    { icon:'🛑', label:'Stop fueling, drain safely, repair', pro:'Removes the danger', con:'Delays launch by days', ok:true,
      why:'Fixing it properly costs days, but a delay is far cheaper than a fire on the pad.' },
    { icon:'➕', label:'Pump in extra hydrogen to make up for it', pro:'Full tank for performance', con:'Feeds the leak', ok:false,
      why:'More hydrogen only means more fuel escaping next to the rocket. The leak has to be fixed first.' } ],
   fact:'Shuttle launches were scrubbed several times because of hydrogen leaks, including in 2009 (missions STS-119 and STS-127).' }
];

/* ============ STATE ============ */
const G = { idx:0, holds:0, holdsBy:[0,0,0,0,0], lamps:['active','idle','idle','idle','idle'], started:false };
let sound = true;

/* ============ UI ============ */
const zone = $('#zone');
function buildBoard(){
  $('#board').innerHTML = STATIONS.map((s,i) => `<div class="lamp" data-i="${i}"><i></i><span>${s.lamp}</span></div>`).join('') + '<div id="holds">HOLDS 0</div>';
}
function paintBoard(){
  document.querySelectorAll('.lamp').forEach((el,i) => { el.className = 'lamp ' + G.lamps[i]; });
  $('#holds').textContent = 'HOLDS ' + G.holds;
}
const AVATAR = `<svg viewBox="0 0 64 64" width="58" height="58" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#1B2440" stroke="#2A3550"/><path d="M13 42c0-17 8-26 19-26s19 9 19 26c0 6-4 10-8 10H21c-4 0-8-4-8-10z" fill="#3b2a24"/><ellipse cx="32" cy="37" rx="12" ry="14" fill="#e8b48f"/><path d="M20 33c4-11 20-11 24 0c-6-4-18-4-24 0z" fill="#3b2a24"/><circle cx="27" cy="37" r="1.7" fill="#222"/><circle cx="37" cy="37" r="1.7" fill="#222"/><path d="M24 32l5-2.4M40 32l-5-2.4" stroke="#3b2a24" stroke-width="1.6" stroke-linecap="round"/><path d="M28 45c2-1.8 6-1.8 8 0" stroke="#7a3b2e" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M16 38c0-13 6-20 16-20s16 7 16 20" fill="none" stroke="#9AA5BD" stroke-width="2.4"/><rect x="13" y="35" width="5" height="9" rx="2" fill="#9AA5BD"/><rect x="46" y="35" width="5" height="9" rx="2" fill="#9AA5BD"/><path d="M48 44c0 5-6 6-12 6" stroke="#9AA5BD" stroke-width="1.8" fill="none"/><circle cx="35" cy="50" r="2" fill="#F2A93B"/><circle cx="52" cy="14" r="9" fill="#F2A93B"/><text x="52" y="18.5" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1205" font-family="sans-serif">?</text></svg>`;

function showIntro(){
  zone.innerHTML = `
    <div class="station">MISSION BRIEFING</div>
    <h2>You are the Launch Director</h2>
    <p class="txt">The Space Shuttle stands on Pad 39A at the Kennedy Space Center. Five team leaders will ask for your call. Weigh each trade-off and say GO or NO-GO. Get every call right, and the shuttle flies.</p>
    <button class="btn" id="startPoll">Start the GO / NO-GO poll ▶</button>`;
  $('#startPoll').onclick = () => { G.started = true; showDecision(); };
}
function showDecision(){
  const s = STATIONS[G.idx];
  G.lamps[G.idx] = 'active'; paintBoard();
  const opts = shuffle(s.options.slice());
  zone.innerHTML = `
    <div class="station">${s.icon} ${s.role.toUpperCase()} · STATION ${G.idx+1} OF ${STATIONS.length}</div>
    <h2>${s.title}</h2>
    <p class="txt">${s.text}</p>
    <div class="opts">${opts.map((o,i) => `
      <button class="opt" data-i="${i}">
        <span class="oi">${o.icon}</span><span class="ol">${o.label}</span>
        <span class="tag pro">＋ ${o.pro}</span><span class="tag con">－ ${o.con}</span>
      </button>`).join('')}</div>`;
  zone.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(s, opts[+b.dataset.i]));
}
function pick(s, o){
  if (o.ok){
    G.lamps[G.idx] = 'go'; paintBoard();
    zone.innerHTML = `
      <div class="verdict go">✅ ${s.role}: GO</div>
      <p class="why">${o.why}</p>
      <p class="fact">🛰️ Real mission: ${s.fact}</p>
      <button class="btn" id="nextBtn">${G.idx < STATIONS.length-1 ? 'Next station ▶' : 'Finish the poll ▶'}</button>`;
    $('#nextBtn').onclick = () => { G.idx++; if (G.idx < STATIONS.length) showDecision(); else showReady(); };
  } else {
    G.holds++; G.holdsBy[G.idx]++; G.lamps[G.idx] = 'nogo'; paintBoard();
    fx.alarm = 1.6;
    zone.innerHTML = `
      <div class="verdict nogo">🛑 NO-GO · Countdown on hold</div>
      <div class="advisor">${AVATAR}<div>
        <p><b>Mission Control</b></p>
        <p>Hmm… are you sure? ${o.why}</p>
        <p class="fact">🛰️ Real mission: ${s.fact}</p>
      </div></div>
      <button class="btn" id="retry">Review the options again ↺</button>`;
    $('#retry').onclick = () => showDecision();
  }
}
function showReady(){
  zone.innerHTML = `
    <div class="verdict go">✅ ALL STATIONS GO</div>
    <p class="why">Every team leader reports GO. Launch Director, you may begin the terminal countdown.</p>
    <button class="btn" id="launchBtn">🚀 Begin countdown</button>`;
  $('#launchBtn').onclick = () => beginLaunch();
}
function showResult(){
  const stars = G.holds === 0 ? 3 : G.holds <= 2 ? 2 : 1;
  zone.style.display = 'block';
  zone.innerHTML = `
    <div class="verdict go">🎉 Orbit achieved!</div>
    <div class="stars" aria-label="${stars} out of 3 stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p class="why">${G.holds === 0 ? 'A perfect poll: every call right the first time.' : `You needed ${G.holds} hold${G.holds===1?'':'s'}, but you got the whole team to GO.`}</p>
    <ul class="debrief">${STATIONS.map((s,i) => `<li><b>${s.icon} ${s.title}</b>${G.holdsBy[i] ? ` <span style="color:var(--danger)">(${G.holdsBy[i]} hold${G.holdsBy[i]===1?'':'s'})</span>` : ''}<br>${s.options.find(o=>o.ok).label}: ${s.options.find(o=>o.ok).why}</li>`).join('')}</ul>
    <button class="btn" id="again">Play again ↺</button><button class="btn ghost" id="replay">Replay the launch 🎬</button>
    <p class="note">Facts are based on NASA Space Shuttle history (Challenger 1986, abort sites, 2009 hydrogen-leak scrubs, rocket equation, Earth's spin at 28.5°N). Re-verify against NASA archives before citing.</p>`;
  $('#again').onclick = resetGame;
  $('#replay').onclick = () => { zone.style.display = 'none'; beginLaunch(true); };
}
function resetGame(){
  G.idx = 0; G.holds = 0; G.holdsBy = [0,0,0,0,0]; G.lamps = ['active','idle','idle','idle','idle'];
  paintBoard(); resetScene(); $('#hud').style.display = 'none'; $('#cap').style.display = 'none'; $('#skip').style.display = 'none';
  zone.style.display = 'block'; showDecision();
}

/* ============ CANVAS SCENE ============ */
const cv = $('#c'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, ppm=4, gY=0, padX=0, ry0=0;
function resize(){
  const r = cv.parentElement.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = Math.max(1,r.width); H = Math.max(1,r.height);
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  ppm = Math.min(H*0.44/56, W*0.38/24);
  gY = H*0.88; padX = W*0.5; ry0 = gY - (6+23)*ppm;
}

let phase='pad', pT0=0, last=0;
let gx=0, gy=0, flow={x:0,y:0}, theta=0, rocket={x:0,y:0}, thrustS=0, thrustB=0, flash=0, shake=0, alt=0, speedKmh=0, met=0, cT=16, veil=0, sway=0;
let hasET=true, hasSRB=true, doneShown=false, etPiece=null, capUntil=0, lastBeep=99, emitAcc=0, steamAcc=0;
const fx = { alarm:0 };
const fired = new Set();
const parts = [], clouds = [], streaks = [], srbs = [];
const starR = (() => { let a=7; return () => { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; })();
const STARS = Array.from({length:150}, () => ({x:starR(), y:starR(), r:starR()*1.3+.3, tw:starR()*6}));
const LIFT = 2.2, ASC_END = 30, ORBIT_DUR = 9;
const MET_KEYS = [[0,0],[3.5,7],[8,60],[14,124],[24,510],[26,530],[30,545]];
const ALT_KEYS = [[0,0],[7,0.12],[60,12],[124,45],[510,112],[545,160]];
const SPD_KEYS = [[0,0],[7,60],[60,1700],[124,4800],[510,27000],[545,27800]];
const EVENTS = [
  { t:0,   title:'LIFTOFF!',                 fact:'About 2,000 tonnes of rocket rise on roughly 6.8 million pounds of thrust.' },
  { t:3.6, title:'Tower cleared',            fact:'The shuttle clears the launch tower in about 7 seconds.' },
  { t:5.4, title:'Roll and pitch program',   fact:'The shuttle rolls and tilts toward the east to start curving toward orbit.' },
  { t:8,   title:'Max-Q: peak air pressure', fact:'The main engines throttle down briefly so the fast-moving air does not strain the rocket.' },
  { t:14,  title:'Booster separation',       fact:'The solid boosters burn out and fall away. Ships recover them from the Atlantic for reuse.' },
  { t:24,  title:'Main engine cut-off',      fact:'The main engines stop. The shuttle is almost in orbit, flying near 27,000 km/h.' },
  { t:26.2,title:'External tank released',   fact:'The orange tank drops away and breaks up over the ocean.' }
];
const CNT_EVENTS = [
  { c:16, title:'T-16: Water floods the pad', fact:'A huge flood of water muffles the roar so sound waves do not damage the shuttle.' },
  { c:10, title:'T-10: Hydrogen igniters', fact:'Sparklers burn off stray hydrogen under the engines before they start.' },
  { c:6.6,title:'T-6.6: Main engines start', fact:'The three main engines light first and are checked before the boosters ignite.' },
  { c:0.2,title:'T-0: Booster ignition', fact:'Once the solid boosters light, they cannot be shut off. Liftoff is committed.' }
];

function initClouds(){
  clouds.length = 0;
  for (let i=0;i<16;i++) clouds.push({ x:rand(0,W), y:rand(0,H*0.66), s:rand(50,150), d:rand(0.55,1.25) });
}
function resetScene(){
  phase='pad'; gx=0; gy=0; flow={x:0,y:0}; theta=0; thrustS=0; thrustB=0; flash=0; shake=0; alt=0; speedKmh=0; met=0; veil=0; sway=0;
  hasET=true; hasSRB=true; doneShown=false; etPiece=null; fired.clear(); parts.length=0; srbs.length=0; streaks.length=0; lastBeep=99;
  audioThrust(0); initClouds();
}

/* ---------- audio (optional, synthesized) ---------- */
let AC=null, nGain=null, nFilt=null;
function audioInit(){
  if (AC) return;
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const buf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate), d = buf.getChannelData(0); let l=0;
    for (let i=0;i<d.length;i++){ l = (l + 0.02*(Math.random()*2-1))/1.02; d[i] = l*3.5; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    nFilt = AC.createBiquadFilter(); nFilt.type = 'lowpass'; nFilt.frequency.value = 160;
    nGain = AC.createGain(); nGain.gain.value = 0;
    src.connect(nFilt).connect(nGain).connect(AC.destination); src.start();
  } catch(e){ AC = null; }
}
function audioThrust(v){
  if (!AC || !nGain) return;
  const t = AC.currentTime;
  nGain.gain.setTargetAtTime(sound ? v*0.8 : 0, t, 0.2);
  nFilt.frequency.setTargetAtTime(140 + v*900, t, 0.25);
}
function beep(f=880, d=0.08){
  if (!AC || !sound) return;
  try { const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; g.gain.value=0.08; o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d); } catch(e){}
}

/* ---------- sequence control ---------- */
function setCap(title, fact, secs=4.6){
  $('#capT').textContent = title; $('#capP').textContent = fact || '';
  $('#cap').style.display = 'block'; capUntil = now() + secs;
}
function beginLaunch(isReplay){
  resetScene();
  audioInit(); if (AC && AC.state === 'suspended') AC.resume();
  zone.style.display = 'none';
  $('#hud').style.display = 'block'; $('#skip').style.display = 'none';
  phase = 'countdown'; pT0 = now(); cT = 16; lastBeep = 99;
  requestAnimationFrame(() => { resize(); });
}
$('#skip').onclick = () => { if (phase==='ascent'){ phase='orbit'; pT0=now(); veil=1; audioThrust(0); } };
$('#sound').onclick = () => { sound = !sound; $('#sound').textContent = sound ? '🔊' : '🔇'; if (!sound) audioThrust(0); };

/* ---------- update ---------- */
function emit(type,x,y,vx,vy,r,gr,life,col,a){
  parts.push({type,x,y,vx,vy,r,gr,life,max:life,col,a:a==null?0.6:a});
  if (parts.length > 650) parts.shift();
}
function baseOf(rx,ry,th){ const d=23*ppm; return { x: rx - d*Math.sin(th), y: ry + d*Math.cos(th) }; }
function update(dt, t){
  // ambient clouds drift
  const ambient = phase==='pad' || phase==='countdown';
  if (ambient){ flow.x = -5; flow.y = 0; }
  if (fx.alarm > 0) fx.alarm -= dt;
  if (flash > 0) flash = Math.max(0, flash - dt*1.4);
  if (shake > 0) shake = Math.max(0, shake - dt*2.2);

  if (phase === 'pad'){
    steamAcc += dt;
    if (steamAcc > 0.14){ steamAcc = 0; emit('steam', padX + rand(-1,1)*ppm, ry0 - 27*ppm, rand(8,22), rand(-26,-12), 2.5*ppm/4+2, 5, 3, '#ffffff', 0.5); }
    rocket.x = padX; rocket.y = ry0; theta = 0;
  }
  else if (phase === 'countdown'){
    const el = t - pT0; cT = 16 - el/0.55;
    for (const e of CNT_EVENTS){ if (cT <= e.c && !fired.has('c'+e.c)){ fired.add('c'+e.c); setCap(e.title, e.fact, 4); } }
    const sec = Math.ceil(cT);
    if (sec !== lastBeep){ lastBeep = sec; if (sec <= 10 && sec > 0) beep(sec<=3?1100:880, 0.07); }
    if (cT <= 16){ // water mist
      emitAcc += dt;
      while (emitAcc > 0.02){ emitAcc -= 0.02; const s = Math.random()<.5?-1:1;
        emit('mist', padX + s*rand(8,22)*ppm, gY - 6*ppm, s*rand(25,90), -rand(25,80), 3, 20, 2.2, '#d6ecff', 0.55); }
    }
    if (cT <= 10 && cT > 0){ for (let i=0;i<2;i++) emit('spark', padX+rand(-3,3)*ppm, gY-6*ppm, rand(-70,70), -rand(30,110), 1.6, -1, 0.7, '#ffb347', 0.9); }
    if (cT <= 6.6){
      thrustS = clamp((6.6 - cT)/3.2) * 0.55;
      sway = Math.sin(el*9)*0.006*Math.max(0, 1-(6.6-cT)/2.5);
      shake = Math.max(shake, thrustS*1.5);
      for (let i=0;i<2;i++) emit('smoke', padX + rand(-12,12)*ppm, gY - 5*ppm, rand(-70,70)*thrustS*2, -rand(5,35), 8, 28, 3, '#e6e1dc', 0.5);
      audioThrust(thrustS*0.7);
    }
    rocket.x = padX; rocket.y = ry0; theta = sway;
    if (cT <= 0){ phase='ascent'; pT0 = t; flash = 1; shake = 7; thrustS = 1; thrustB = 1; burst(); }
  }
  else if (phase === 'ascent'){
    const ta = t - pT0;
    // rocket on screen
    const ryLock = H*0.52;
    rocket.x = padX;
    if (ta < LIFT){ const k = ta/LIFT; rocket.y = lerp(ry0, ryLock, k*k); }
    else rocket.y = ryLock;
    theta = ta < 4.2 ? sway*Math.max(0,1-ta/2) : ease(clamp((ta-4.2)/20)) * 1.05;
    // background flow after lock
    const vLock = 2*(ry0 - ryLock)/LIFT;
    if (ta >= LIFT){
      const v = Math.min(1150, vLock + (ta-LIFT)*70);
      flow.x = -Math.sin(theta)*v; flow.y = Math.cos(theta)*v;
    } else { flow.x = 0; flow.y = 0; }
    gx += flow.x*dt; gy += flow.y*dt;
    // telemetry
    met = interp(MET_KEYS, ta); alt = interp(ALT_KEYS, met); speedKmh = interp(SPD_KEYS, met);
    // thrust profile
    const maxq = ta > 6.8 && ta < 9.2 ? 0.72 : 1;
    thrustS = ta < 24 ? maxq : 0; thrustB = hasSRB ? 1 : 0;
    audioThrust(ta < 24 ? 0.9 : (ta < 28 ? 0.25 : 0));
    shake = ta < 5 ? Math.max(shake, 4*(1-ta/5)) : (ta<14 ? 1.2 : 0.4);
    // events
    for (const e of EVENTS){ if (ta >= e.t && !fired.has('e'+e.t)){ fired.add('e'+e.t); setCap(e.title, e.fact, 4.6); } }
    if (ta >= 14 && !fired.has('srb')){ fired.add('srb'); separateSRB(); }
    if (ta >= 26.2 && !fired.has('et')){ fired.add('et'); separateET(); }
    if (ta > 4 && $('#skip').style.display === 'none') $('#skip').style.display = 'block';
    // exhaust emission
    const b = baseOf(rocket.x, rocket.y, theta);
    emitAcc += dt;
    while (emitAcc > 0.016 && thrustS > 0){ emitAcc -= 0.016;
      const hot = ta < 2.5;
      for (const ox of (hasSRB ? [-6.1,-1.7,0,1.7,6.1] : [-1.7,0,1.7])){
        const px = b.x + Math.cos(theta)*ox*ppm, py = b.y + Math.sin(theta)*ox*ppm + 3*ppm;
        emit('smoke', px, py, rand(-25,25), rand(0,25), (Math.abs(ox)>3?4.5:2.6)*ppm/4+2, 22, rand(1.8,3.2), hot?'#f3c79a':'#f0f0f2', hot?0.55:0.4);
      }
    }
    if (ta < 6 && ta >= 0){ // ground cloud keeps feeding
      steamAcc += dt; if (steamAcc > 0.03){ steamAcc = 0; const s = Math.random()<.5?-1:1;
        emit('smoke', padX + s*rand(4,16)*ppm, gY+gy-5*ppm, s*rand(90,260), -rand(5,40), 10, 34, rand(2.5,4), '#e9e2da', 0.55); }
    }
    // streaks
    if (ta > LIFT && streaks.length < 36 && Math.random() < 0.7){
      streaks.push({ x:rand(0,W), y:rand(-40,H), l:rand(30,110), life:rand(0.4,0.9), max:0.9 });
    }
    // moving objects
    if (ta > 24 && ta < ASC_END - 0.8 && false) {}
    // fade out to orbit
    veil = ta > ASC_END - 0.9 ? clamp((ta - (ASC_END-0.9))/0.9) : 0;
    if (ta >= ASC_END){ phase = 'orbit'; pT0 = t; veil = 1; audioThrust(0); $('#skip').style.display='none'; }
  }
  else if (phase === 'orbit' || phase === 'done'){
    const to = t - pT0;
    alt = 320; speedKmh = 27800; met = 560 + to;
    veil = clamp(1 - to/0.9);
    if (phase==='orbit'){
      if (to > 0.3 && !fired.has('orbitcap')){ fired.add('orbitcap'); setCap('ORBIT ACHIEVED!', 'At about 28,000 km/h the shuttle circles the Earth roughly every 90 minutes. The cargo bay opens and the satellite is released.', 99); }
      if (to > ORBIT_DUR){ phase = 'done'; showResult(); }
    }
  }
  // particles
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0){ parts.splice(i,1); continue; }
    const wind = (p.type==='steam') ? 0 : 0;
    p.x += (p.vx + flow.x + wind)*dt; p.y += (p.vy + flow.y)*dt;
    if (p.gr > 0) p.r += p.gr*dt;
    if (p.type==='mist' || p.type==='spark') p.vy += 90*dt;
  }
  for (let i=streaks.length-1;i>=0;i--){ const s=streaks[i]; s.life -= dt; s.x += flow.x*1.5*dt; s.y += flow.y*1.5*dt; if (s.life<=0 || s.y>H+120 || s.x<-120) streaks.splice(i,1); }
  for (const c of clouds){
    c.x += flow.x*c.d*dt; c.y += flow.y*c.d*dt;
    if (c.y > H + 120){ c.y = -120; c.x = rand(0,W); }
    if (c.x < -220){ c.x = W + 220; c.y = rand(-100, H*0.7); }
  }
  for (let i=srbs.length-1;i>=0;i--){
    const s = srbs[i]; s.vy += 70*dt; s.x += (s.vx + flow.x*0.55)*dt; s.y += (s.vy + flow.y*0.55)*dt; s.rot += s.vr*dt; s.burn = Math.max(0, s.burn - dt);
    if (s.burn > 0) emit('smoke', s.x, s.y, rand(-15,15), rand(0,20), 5, 14, 1.6, '#f0f0f2', 0.4);
    if (s.y > H+200 || s.x < -200 || s.x > W+200) srbs.splice(i,1);
  }
  if (etPiece){ const e=etPiece; e.vy += 40*dt; e.x += (e.vx + flow.x*0.5)*dt; e.y += (e.vy + flow.y*0.5)*dt; e.rot += e.vr*dt; if (e.y > H+250) etPiece = null; }
  if (capUntil && now() > capUntil && phase !== 'orbit' && phase !== 'done'){ $('#cap').style.display = 'none'; capUntil = 0; }
}
function burst(){
  for (let i=0;i<110;i++){
    const s = Math.random()<.5?-1:1;
    emit('smoke', padX + s*rand(2,20)*ppm, gY - 5*ppm + gy, s*rand(60,360), -rand(0,60), rand(8,16), rand(20,50), rand(2.5,5), Math.random()<.35?'#f4c493':'#ebe5de', 0.6);
  }
}
function separateSRB(){
  hasSRB = false; thrustB = 0;
  const c = Math.cos(theta), s = Math.sin(theta), h = {x:s, y:-c};
  for (const side of [-1,1]){
    srbs.push({ x: rocket.x + side*c*6.1*ppm, y: rocket.y + side*s*6.1*ppm, vx: side*c*110 - h.x*120, vy: side*s*110 - h.y*120 + 20, rot: theta, vr: side*0.9, burn: 0.6 });
  }
  flash = Math.max(flash, 0.35);
  for (let i=0;i<30;i++) emit('smoke', rocket.x + rand(-8,8)*ppm, rocket.y + rand(-6,10)*ppm, rand(-90,90), rand(-60,60), 6, 24, 2, '#ffffff', 0.5);
}
function separateET(){
  hasET = false;
  etPiece = { x: rocket.x, y: rocket.y, vx: -Math.cos(theta)*20 - Math.sin(theta)*80, vy: Math.sin(theta)*20 + Math.cos(theta)*80, rot: theta, vr: 0.7 };
  for (let i=0;i<24;i++) emit('smoke', rocket.x + rand(-5,5)*ppm, rocket.y + rand(-3,12)*ppm, rand(-70,70), rand(-40,70), 5, 20, 1.6, '#ffffff', 0.5);
}

/* ---------- drawing helpers ---------- */
function drawSky(){
  const f = ease(clamp(alt/70));
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, mixc('#0b1030','#000106',f));
  g.addColorStop(0.55, mixc('#3a3a78','#01030b',f));
  g.addColorStop(1, mixc('#ff9a62','#02050f',f));
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  const sa = 0.3 + 0.7*clamp(alt/45);
  ctx.fillStyle = '#fff';
  const tt = performance.now()/700;
  for (const s of STARS){ ctx.globalAlpha = sa*(0.55+0.45*Math.sin(tt+s.tw)); ctx.beginPath(); ctx.arc(s.x*W, s.y*H*0.8, s.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}
function drawClouds(){
  const a = clamp(1 - alt/16);
  if (a <= 0.02) return;
  for (const c of clouds){
    const g = ctx.createLinearGradient(0, c.y-c.s*0.2, 0, c.y+c.s*0.25);
    g.addColorStop(0, `rgba(140,128,190,${0.55*a})`); g.addColorStop(1, `rgba(255,205,160,${0.7*a})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.s, c.s*0.22, 0, 0, 6.283);
    ctx.ellipse(c.x - c.s*0.45, c.y + c.s*0.04, c.s*0.55, c.s*0.17, 0, 0, 6.283);
    ctx.ellipse(c.x + c.s*0.5, c.y + c.s*0.05, c.s*0.6, c.s*0.16, 0, 0, 6.283);
    ctx.fill();
  }
}
function drawStreaks(){
  if (!streaks.length) return;
  const m = Math.hypot(flow.x, flow.y) || 1, ux = flow.x/m, uy = flow.y/m;
  ctx.lineWidth = 1.4;
  for (const s of streaks){
    ctx.strokeStyle = `rgba(255,255,255,${0.35*clamp(s.life/s.max)*clamp(1-alt/150)})`;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - ux*s.l, s.y - uy*s.l); ctx.stroke();
  }
}
function drawGround(){
  if (gy > H*1.1 || gx < -W*2) return;
  const gnd = gY + gy, hy = H*0.70 + gy*0.35, ox = W*0.5 + gx*0.35;
  // sun glow
  const f = clamp(1 - alt/60);
  if (f > 0 && hy < H + 200){
    const sg = ctx.createRadialGradient(W*0.9+gx*0.3, hy, 0, W*0.9+gx*0.3, hy, W*0.6);
    sg.addColorStop(0, `rgba(255,200,120,${0.85*f})`); sg.addColorStop(1, 'rgba(255,150,90,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, hy - W*0.6, W, W*0.6 + 4);
  }
  // distant land + VAB
  ctx.fillStyle = '#2a2f55'; ctx.fillRect(-10, hy, ox+10, gnd - hy + 2);
  const vh = H*0.17, vw = vh*1.25, vx = W*0.1 + gx*0.35;
  ctx.fillStyle = '#4b4f7a'; ctx.fillRect(vx, hy - vh*0.82, vw, vh*0.86);
  ctx.fillStyle = '#3a3e66'; ctx.fillRect(vx, hy - vh*0.82, vw*0.28, vh*0.86);
  ctx.fillStyle = '#2a2d52'; ctx.fillRect(vx + vw*0.5, hy - vh*0.8, vw*0.22, vh*0.5);
  // ocean
  const og = ctx.createLinearGradient(0, hy, 0, gnd);
  og.addColorStop(0, '#f2a273'); og.addColorStop(0.35, '#4b5f9f'); og.addColorStop(1, '#1f2c5c');
  ctx.fillStyle = og; ctx.fillRect(ox, hy, W - ox + 200, gnd - hy + 2);
  ctx.fillStyle = 'rgba(255,220,170,.35)';
  for (let i=0;i<14;i++){ const yy = hy + (gnd-hy)*(i/14)*(i/14) + 2, ww = 6 + i*5; ctx.fillRect(W*0.88 + gx*0.35 - ww/2, yy, ww, 1.4); }
  // land band
  const lg = ctx.createLinearGradient(0, gnd, 0, gnd + H*0.2);
  lg.addColorStop(0, '#1d2a22'); lg.addColorStop(1, '#0c1511');
  ctx.fillStyle = lg; ctx.fillRect(-10, gnd, W+20, H*0.4);
  // pad structures (relative to stack base)
  const bx = padX + gx, by = gnd;
  ctx.save(); ctx.translate(bx, by); ctx.scale(ppm, ppm);
  // flame trench / mound
  ctx.fillStyle = '#6d7179'; ctx.beginPath(); ctx.moveTo(-26,0); ctx.lineTo(-17,-6); ctx.lineTo(17,-6); ctx.lineTo(26,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8b9099'; ctx.fillRect(-17,-6.6,34,0.8);
  ctx.fillStyle = '#22252c'; ctx.fillRect(-4.2,-6,8.4,5);
  // tower
  const tx = -30;
  ctx.strokeStyle = '#a7452f'; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.moveTo(tx,-1); ctx.lineTo(tx,-78); ctx.moveTo(tx+9,-1); ctx.lineTo(tx+9,-78); ctx.stroke();
  ctx.lineWidth = 0.35;
  ctx.beginPath(); for (let y=-1;y>-76;y-=6){ ctx.moveTo(tx,y); ctx.lineTo(tx+9,y); ctx.moveTo(tx,y); ctx.lineTo(tx+9,y-6); ctx.moveTo(tx+9,y); ctx.lineTo(tx,y-6); } ctx.stroke();
  ctx.strokeStyle = '#cfd3da'; ctx.lineWidth = 0.4; ctx.beginPath(); ctx.moveTo(tx+4.5,-78); ctx.lineTo(tx+4.5,-100); ctx.stroke();
  ctx.fillStyle = (Math.floor(performance.now()/500)%2) ? '#ff4d4d' : '#6b2222'; ctx.beginPath(); ctx.arc(tx+4.5,-100.4,0.9,0,6.283); ctx.fill();
  if (phase === 'pad'){ // oxygen vent arm to the tank
    ctx.fillStyle = '#b8bcc4'; ctx.fillRect(tx+9, -52, 22.5, 1.1);
    ctx.fillRect(tx+31, -52.8, 3.2, 2.6);
  }
  // water tower (right)
  ctx.fillStyle = '#d9dde4'; ctx.fillRect(36,-86,1.2,86); ctx.fillRect(39,-86,1.2,86);
  ctx.beginPath(); ctx.ellipse(38.6,-88,6.5,4.2,0,0,6.283); ctx.fill();
  ctx.fillStyle = '#b9bec8'; ctx.fillRect(32.1,-88,13,3.4);
  ctx.restore();
  // search-light beams (dawn)
  if (f > 0.3 && gy < H*0.4){
    for (const s of [-1,1]){
      const sx = bx + s*58*ppm;
      const bg = ctx.createLinearGradient(sx, by, bx, by-30*ppm);
      bg.addColorStop(0,'rgba(255,255,230,0.0)'); bg.addColorStop(0.2,'rgba(255,255,230,0.10)'); bg.addColorStop(1,'rgba(255,255,230,0.0)');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(sx-2*ppm, by); ctx.lineTo(sx+2*ppm, by); ctx.lineTo(bx + s*2*ppm, by-60*ppm); ctx.lineTo(bx - s*0, by-60*ppm); ctx.closePath(); ctx.fill();
    }
  }
}
function flamePoly(w, len, core, mid){
  const g = ctx.createLinearGradient(0,0,0,len);
  g.addColorStop(0, core); g.addColorStop(0.35, mid); g.addColorStop(1, 'rgba(255,80,20,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-w,0); ctx.quadraticCurveTo(-w*0.9, len*0.5, 0, len); ctx.quadraticCurveTo(w*0.9, len*0.5, w, 0); ctx.closePath(); ctx.fill();
}
function drawFlames(tt){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (thrustS > 0.02){
    for (const x of [-1.7,0,1.7]){
      ctx.save(); ctx.translate(x, 24.5); flamePoly(0.95, (18 + 6*Math.sin(tt*40+x))*thrustS, 'rgba(210,230,255,0.95)', 'rgba(255,170,80,0.7)'); ctx.restore();
    }
  }
  if (thrustB > 0.02 && hasSRB){
    for (const s of [-1,1]){
      ctx.save(); ctx.translate(6.1*s, 28.2); flamePoly(1.9, (38 + 9*Math.sin(tt*33+s))*thrustB, 'rgba(255,248,210,0.95)', 'rgba(255,170,60,0.75)'); ctx.restore();
    }
  }
  ctx.restore();
}
function drawSrbShape(){ // one SRB centred at origin, vertical, nose up
  ctx.fillStyle = '#f2f3f5'; ctx.fillRect(-1.85,-20,3.7,38);
  ctx.fillStyle = '#cfd3da'; ctx.beginPath(); ctx.moveTo(-1.85,-20); ctx.lineTo(0,-29); ctx.lineTo(1.85,-20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8c929c'; ctx.fillRect(-1.85,-20.6,3.7,0.8); ctx.fillRect(-1.85,2,3.7,0.5);
  ctx.fillStyle = '#4a4e57'; ctx.beginPath(); ctx.moveTo(-1.2,18); ctx.lineTo(1.2,18); ctx.lineTo(1.7,21); ctx.lineTo(-1.7,21); ctx.closePath(); ctx.fill();
}
function drawStack(){
  const B = 23; // local y of the base; origin is the stack centre
  if (hasET){
    const g = ctx.createLinearGradient(-4.2,0,4.2,0);
    g.addColorStop(0,'#a5501a'); g.addColorStop(0.35,'#f3913f'); g.addColorStop(1,'#9a4a17');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-4.2,B); ctx.lineTo(-4.2,B-37); ctx.quadraticCurveTo(-4.2,B-43,0,B-46.8); ctx.quadraticCurveTo(4.2,B-43,4.2,B-37); ctx.lineTo(4.2,B); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(70,30,8,.35)'; ctx.fillRect(-4.2,B-22,8.4,0.5); ctx.fillRect(-4.2,B-6,8.4,0.5);
    ctx.fillStyle = '#d5d8de'; ctx.fillRect(-0.22,B-56,0.44,9.4);
  }
  if (hasSRB){
    for (const s of [-1,1]){ ctx.save(); ctx.translate(6.1*s, B-17); drawSrbShape(); ctx.restore(); }
  }
  // orbiter (seen from behind: wings spread, nose up)
  ctx.fillStyle = '#ecece8';
  for (const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(2.6*s,B-24); ctx.lineTo(11.9*s,B-4); ctx.lineTo(11.9*s,B-2.4); ctx.lineTo(2.6*s,B-2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#2a2a2e'; ctx.lineWidth = 0.55; ctx.beginPath(); ctx.moveTo(2.6*s,B-24); ctx.lineTo(11.9*s,B-4); ctx.stroke();
  }
  const og = ctx.createLinearGradient(-2.6,0,2.6,0); og.addColorStop(0,'#d9d9d5'); og.addColorStop(0.5,'#fbfbf8'); og.addColorStop(1,'#d2d2cd');
  ctx.fillStyle = og; ctx.beginPath(); ctx.moveTo(-2.6,B-3); ctx.lineTo(-2.6,B-30); ctx.quadraticCurveTo(-2.6,B-36,0,B-38.5); ctx.quadraticCurveTo(2.6,B-36,2.6,B-30); ctx.lineTo(2.6,B-3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1f2026'; ctx.beginPath(); ctx.moveTo(-2.2,B-33.4); ctx.quadraticCurveTo(0,B-35.6,2.2,B-33.4); ctx.quadraticCurveTo(1.5,B-36,0,B-38.5); ctx.quadraticCurveTo(-1.5,B-36,-2.2,B-33.4); ctx.fill();
  ctx.fillRect(-1.6,B-32.4,3.2,1.2);
  ctx.strokeStyle = 'rgba(40,40,46,.4)'; ctx.lineWidth = 0.18; ctx.beginPath(); ctx.moveTo(-1.2,B-30); ctx.lineTo(-1.2,B-6); ctx.moveTo(1.2,B-30); ctx.lineTo(1.2,B-6); ctx.stroke();
  ctx.fillStyle = '#3a3b42';
  for (const x of [-1.7,0,1.7]){ ctx.beginPath(); ctx.moveTo(x-0.7,B-2.4); ctx.lineTo(x+0.7,B-2.4); ctx.lineTo(x+1.0,B+1.4); ctx.lineTo(x-1.0,B+1.4); ctx.closePath(); ctx.fill(); }
}
function drawStackFx(tt){
  const rx = rocket.x + 0, ry = rocket.y;
  if (phase === 'pad' || phase === 'countdown'){ rocket.x = padX; rocket.y = ry0; }
  const x = rocket.x + gx*0, y = rocket.y;
  // ground glow
  if ((thrustS > 0 || thrustB > 0) && gy < H*0.3){
    const gl = ctx.createRadialGradient(padX+gx, gY+gy-6*ppm, 0, padX+gx, gY+gy-6*ppm, 55*ppm);
    const a = clamp(thrustS*0.45 + thrustB*0.5);
    gl.addColorStop(0, `rgba(255,190,100,${a})`); gl.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = gl; ctx.fillRect(padX+gx-60*ppm, gY+gy-60*ppm, 120*ppm, 60*ppm);
  }
  ctx.save(); ctx.translate(x, y); ctx.rotate(theta); ctx.scale(ppm, ppm);
  drawFlames(tt); drawStack();
  ctx.restore();
}
function drawLoose(){
  for (const s of srbs){ ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.scale(ppm,ppm); if (s.burn>0){ ctx.globalCompositeOperation='lighter'; ctx.save(); ctx.translate(0,21); flamePoly(1.5, 14*s.burn/0.6+4, 'rgba(255,248,210,.9)','rgba(255,160,60,.6)'); ctx.restore(); ctx.globalCompositeOperation='source-over'; } drawSrbShape(); ctx.restore(); }
  if (etPiece){
    ctx.save(); ctx.translate(etPiece.x, etPiece.y); ctx.rotate(etPiece.rot); ctx.scale(ppm,ppm);
    const g = ctx.createLinearGradient(-4.2,0,4.2,0); g.addColorStop(0,'#a5501a'); g.addColorStop(0.35,'#f3913f'); g.addColorStop(1,'#9a4a17');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-4.2,18); ctx.lineTo(-4.2,-14); ctx.quadraticCurveTo(-4.2,-20,0,-23.8); ctx.quadraticCurveTo(4.2,-20,4.2,-14); ctx.lineTo(4.2,18); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawParts(kind){
  for (const p of parts){
    const isSpark = p.type === 'spark';
    if ((kind === 'spark') !== isSpark) continue;
    const k = clamp(p.life/p.max);
    const a = isSpark ? k*p.a : p.a*k*(0.4+0.6*k);
    const r = Math.max(0.6, p.r);
    if (!isSpark && r > 7){
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      const c = hex(p.col);
      g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${a})`);
      g.addColorStop(0.55, `rgba(${c[0]},${c[1]},${c[2]},${a*0.6})`);
      g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      ctx.globalAlpha = 1; ctx.fillStyle = g;
    } else { ctx.globalAlpha = a; ctx.fillStyle = p.col; }
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawEarthLimb(){
  const f = clamp((alt-28)/60);
  if (f <= 0) return;
  const top = H*(1.04 - 0.2*ease(f)), R = W*2.0;
  const cx = W*0.5 - gx*0.02, cy = top + R;
  ctx.save();
  const ag = ctx.createRadialGradient(cx,cy,R*0.985,cx,cy,R*1.012);
  ag.addColorStop(0,'rgba(120,190,255,0.0)'); ag.addColorStop(0.5,'rgba(140,200,255,0.7)'); ag.addColorStop(1,'rgba(120,190,255,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx,cy,R*1.012,0,6.283); ctx.fill();
  const eg = ctx.createRadialGradient(cx,cy,R*0.6,cx,cy,R);
  eg.addColorStop(0,'#071a45'); eg.addColorStop(1,'#1c5aa8');
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(cx,cy,R*0.995,0,6.283); ctx.fill();
  ctx.restore();
}
function drawOrbiterSide(x, y, L, bob){
  ctx.save(); ctx.translate(x, y + bob); ctx.scale(L, L);
  const lw = 0.004;
  // payload bay doors open
  ctx.fillStyle = '#b9bcc4';
  ctx.beginPath(); ctx.moveTo(0.26,-0.055); ctx.lineTo(0.2,-0.21); ctx.lineTo(0.5,-0.21); ctx.lineTo(0.52,-0.055); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2d313b'; ctx.fillRect(0.27,-0.06,0.25,0.02);
  // wing
  ctx.fillStyle = '#d9dad6'; ctx.beginPath(); ctx.moveTo(0.1,0.04); ctx.lineTo(0.58,0.045); ctx.lineTo(0.22,0.09); ctx.lineTo(0.05,0.055); ctx.closePath(); ctx.fill();
  // fuselage
  ctx.fillStyle = '#f6f6f2'; ctx.beginPath(); ctx.moveTo(0,-0.045); ctx.lineTo(0.76,-0.055); ctx.quadraticCurveTo(0.9,-0.05,0.99,0.0); ctx.quadraticCurveTo(0.9,0.05,0.74,0.06); ctx.lineTo(0,0.06); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1f2026'; ctx.beginPath(); ctx.moveTo(0.88,-0.048); ctx.quadraticCurveTo(0.99,-0.01,0.99,0.0); ctx.quadraticCurveTo(0.9,0.05,0.86,0.055); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a4a78'; ctx.beginPath(); ctx.moveTo(0.8,-0.05); ctx.lineTo(0.87,-0.045); ctx.lineTo(0.86,-0.02); ctx.lineTo(0.8,-0.025); ctx.closePath(); ctx.fill();
  // tail fin
  ctx.fillStyle = '#f0f0ec'; ctx.beginPath(); ctx.moveTo(0.01,-0.045); ctx.lineTo(0.09,-0.25); ctx.lineTo(0.2,-0.25); ctx.lineTo(0.19,-0.05); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#25262c'; ctx.fillRect(0.01,-0.012,0.02,0.07);
  ctx.strokeStyle = '#8b8e96'; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(0.05,-0.16); ctx.lineTo(0.195,-0.14); ctx.stroke();
  ctx.fillStyle = '#d6d6d1'; for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(-0.004, -0.03 + i*0.03, 0.012, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function drawOrbitScene(t){
  const to = t - pT0;
  ctx.fillStyle = '#01030a'; ctx.fillRect(0,0,W,H);
  const tt = performance.now()/800;
  ctx.fillStyle = '#fff';
  for (const s of STARS){ ctx.globalAlpha = 0.5 + 0.5*Math.sin(tt+s.tw); ctx.beginPath(); ctx.arc(s.x*W, s.y*H*0.78, s.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
  // earth
  const top = H*0.7, R = W*1.5, cx = W*0.5, cy = top + R;
  const ag = ctx.createRadialGradient(cx,cy,R*0.98,cx,cy,R*1.03);
  ag.addColorStop(0,'rgba(120,190,255,0)'); ag.addColorStop(0.45,'rgba(150,210,255,0.85)'); ag.addColorStop(1,'rgba(120,190,255,0)');
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(cx,cy,R*1.03,0,6.283); ctx.fill();
  const eg = ctx.createRadialGradient(cx - R*0.25, cy - R*0.6, R*0.05, cx, cy, R);
  eg.addColorStop(0,'#2d7bd1'); eg.addColorStop(0.7,'#103a85'); eg.addColorStop(1,'#071a45');
  ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for (let i=0;i<9;i++){ const px = ((i*0.17 + to*0.012) % 1.2 - 0.1)*W; const py = top + 14 + i*13; ctx.beginPath(); ctx.ellipse(px, py, 70+i*14, 5+i*0.8, 0, 0, 6.283); ctx.fill(); }
  ctx.fillStyle = 'rgba(60,150,80,0.55)';
  ctx.beginPath(); ctx.ellipse(W*0.28 - to*6, top+40, 110, 16, 0.05, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W*0.72 - to*6, top+70, 150, 20, -0.04, 0, 6.283); ctx.fill();
  ctx.restore();
  // sunrise on the limb
  const sg = ctx.createRadialGradient(W*0.08, top+6, 0, W*0.08, top+6, W*0.5);
  sg.addColorStop(0,'rgba(255,200,120,0.9)'); sg.addColorStop(1,'rgba(255,150,80,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, top-W*0.5, W, W*0.55);
  // orbiter drifts across, deploys a satellite
  const L = Math.min(W*0.5, 360), px = lerp(W*0.12, W*0.4, clamp(to/ORBIT_DUR)), py = H*0.42;
  const bob = Math.sin(to*1.3)*4;
  drawOrbiterSide(px, py, L, bob);
  if (to > 3){
    const k = clamp((to-3)/6), sx = px + L*0.4 + k*L*0.35, sy = py - L*0.2 - k*L*0.3 + bob;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(k*1.2); const u = L*0.05;
    ctx.fillStyle = '#c7ccd6'; ctx.fillRect(-u*0.7,-u*0.7,u*1.4,u*1.4);
    ctx.fillStyle = '#2f5fb5'; ctx.fillRect(-u*3,-u*0.4,u*2.1,u*0.8); ctx.fillRect(u*0.9,-u*0.4,u*2.1,u*0.8);
    ctx.fillStyle = '#F2A93B'; ctx.beginPath(); ctx.arc(0, -u*0.9, u*0.25, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

/* ---------- render ---------- */
function render(t){
  ctx.clearRect(0,0,W,H);
  const tt = performance.now()/1000;
  if (phase === 'orbit' || phase === 'done'){
    drawOrbitScene(t);
  } else {
    ctx.save();
    if (shake > 0.1) ctx.translate(rand(-shake,shake), rand(-shake,shake));
    drawSky(); drawEarthLimb(); drawClouds(); drawStreaks(); drawGround();
    drawParts('smoke'); drawStackFx(tt); drawLoose(); drawParts('spark');
    ctx.restore();
    if (flash > 0){ ctx.fillStyle = `rgba(255,240,210,${flash*0.6})`; ctx.fillRect(0,0,W,H); }
  }
  if (fx.alarm > 0){
    const a = 0.22*Math.abs(Math.sin(fx.alarm*9)); ctx.fillStyle = `rgba(240,60,80,${a})`; ctx.fillRect(0,0,W,H);
  }
  if (veil > 0.01){ ctx.fillStyle = `rgba(0,0,0,${veil})`; ctx.fillRect(0,0,W,H); }
  // DOM HUD
  if (phase === 'countdown'){
    const c = Math.max(0, cT), s = Math.ceil(c);
    $('#clock').textContent = 'T-' + String(s).padStart(2,'0');
    $('#tele').innerHTML = 'STATUS <b>' + (c<=6.6 ? 'ENGINES START' : c<=10 ? 'IGNITERS' : 'COUNTING') + '</b><br>ALT <b>0 km</b><br>SPEED <b>0 km/h</b>';
  } else if (phase === 'ascent' || phase === 'orbit' || phase === 'done'){
    const m = Math.floor(met), mm = String(Math.floor(m/60)).padStart(2,'0'), ss = String(m%60).padStart(2,'0');
    $('#clock').textContent = 'T+' + mm + ':' + ss;
    $('#tele').innerHTML = 'ALT <b>' + (alt<10?alt.toFixed(1):Math.round(alt)) + ' km</b><br>SPEED <b>' + Math.round(speedKmh/10)*10 + ' km/h</b><br><span style="opacity:.7">approximate</span>';
  }
}
let lastT = 0;
function frame(){
  requestAnimationFrame(frame);
  if (!W) return;
  const t = now();
  const dt = Math.min(0.06*TS, Math.max(0, t - (lastT || t))); lastT = t;
  update(dt, t); render(t);
}

/* ============ INIT ============ */
buildBoard(); paintBoard();
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe($('#stage'));
resize(); initClouds();
showIntro();
requestAnimationFrame(frame);
})();
</script>
